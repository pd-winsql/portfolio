<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Winjemelron Corpuz | Analysis and Development</title>
        <meta
            name="description"
            content="Winjemelron Corpuz: data analysis with PostgreSQL, Power BI, and Excel, plus AI-assisted business systems and websites. Open to roles and freelance projects."
        />
        <meta name="theme-color" content="#f7f5f0" />
        <script>
            (() => {
                let saved;
                try { saved = localStorage.getItem('portfolio-theme'); } catch {}
                const theme = saved === 'light' || saved === 'dark'
                    ? saved
                    : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
                document.documentElement.dataset.theme = theme;
                document.querySelector('meta[name="theme-color"]').content = theme === 'dark' ? '#171c19' : '#f7f5f0';
            })();
        </script>
        <link
            rel="icon"
            type="image/png"
            href="/assets/win-corpuz-logo-v2.png"
        />
        <meta
            name="google-site-verification"
            content="Z49p8rjnBGS7DfNWF3MxVQevcEX3ah6G6rgnohHGyUY"
        />
    </head>
    <body>
        <!-- React owns this element's contents; Vite processes the module below. -->
        <div id="root"></div>
        <script type="module" src="/src/main.jsx"></script>
    </body>
</html>
